[project]
name = "syncreward"
description = "SyncReward for ComfyUI: score how well a video's sound is synchronized with its picture (0 to 2), and pick the best of several generated videos. The official model, run in-process."
version = "0.1.1"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["transformers>=5.1.0", "timm>=1.0.26", "PyYAML"]

[project.urls]
Repository = "https://github.com/hiroki-abe-58/ComfyUI-SyncReward"

[tool.comfy]
PublisherId = "hiroki-abe-58"
DisplayName = "SyncReward for ComfyUI"
Icon = ""

[tool.ruff]
line-length = 180
target-version = "py310"
extend-exclude = ["syncreward_comfy/vendor"]

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
